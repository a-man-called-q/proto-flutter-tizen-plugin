name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          components: clippy, rustfmt
          targets: wasm32-wasip1
      # The install tests create shims, which need the proto-shim binary
      - uses: moonrepo/setup-toolchain@v0
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo build --target wasm32-wasip1
      - run: cargo test --no-default-features

  # Installs with the real proto binary, then runs the tool through both
  # `proto run` and its shim
  e2e:
    name: E2E
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    defaults:
      run:
        shell: bash
    env:
      PROTO_FLUTTER_TIZEN_VERSION: 3.44.4-tizen.1.0.0
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          targets: wasm32-wasip1
      - uses: moonrepo/setup-toolchain@v0
      - run: cargo build --target wasm32-wasip1
      # `.prototools` loads the published plugin, so test this build instead
      - run: proto plugin add flutter-tizen "file://./target/wasm32-wasip1/debug/flutter_tizen_plugin.wasm"
      - run: proto install flutter-tizen "$PROTO_FLUTTER_TIZEN_VERSION"
      - run: proto run flutter-tizen -- --version | grep "Flutter 3.44.4"
      - run: |
          "${PROTO_HOME:-$HOME/.proto}/shims/flutter-tizen" --version | grep "Flutter 3.44.4"
