[package]
name = "flutter_tizen_plugin"
version = "0.1.0"
edition = "2024"
description = "flutter-tizen WASM plugin for proto."
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
extism-pdk = { version = "1.4.1", optional = true }
proto_pdk = { version = "0.35.5", optional = true }
schematic = { version = "0.20.6", default-features = false, features = [
    "schema",
] }
serde = { version = "1.0.228", features = ["derive"] }
version_spec = "0.11.6"

[dev-dependencies]
proto_pdk_test_utils = "0.50.2"
starbase_sandbox = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }

[features]
default = ["wasm"]
# The PDKs import host functions that only exist when running as WASM,
# so they must stay out of native builds (tests).
wasm = ["dep:extism-pdk", "dep:proto_pdk"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
